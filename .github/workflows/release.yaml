name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ========================================
  # Extract version from tag
  # ========================================
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ========================================
  # Fetch dependencies on Linux using ocicl
  # ========================================
  fetch-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install ocicl (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          gh release download --repo ocicl/ocicl --pattern '*_amd64.deb' --dir /tmp
          sudo dpkg -i /tmp/ocicl_*_amd64.deb
          ocicl setup > ~/.sbclrc

      - name: Fetch Lisp dependencies
        run: ocicl install

      - name: Generate SBOM
        run: ocicl create-sbom cyclonedx icl-sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: icl-sbom.json
          retention-days: 1

      - name: Upload ocicl directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocicl-deps
          path: ocicl
          retention-days: 1

  # ========================================
  # Build Linux packages (RPM and DEB)
  # ========================================
  build-rpm:
    needs: [fetch-deps, extract-version]
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rpm-sign sbcl libfixposix-devel gcc make

      - name: Setup rpmbuild directory
        run: |
          rpmdev-setuptree

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Create source tarball
        run: |
          cd ..
          tar czf ~/rpmbuild/SOURCES/icl-${VERSION}.tar.gz --transform "s,^icl,icl-${VERSION}," icl

      - name: Update spec file version
        run: |
          sed -i "s/^Version:.*/Version:        ${VERSION}/" releng/icl.spec
          cp releng/icl.spec ~/rpmbuild/SPECS/

      - name: Build RPM and SRPM
        run: |
          cd ~/rpmbuild/SPECS
          rpmbuild -ba icl.spec

      - name: Verify version is not dirty
        run: |
          OCICL_BIN=$(find ~/rpmbuild/BUILD -name icl -type f -executable | head -1)
          VERSION=$("$OCICL_BIN" --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          # Configure gpg for non-interactive use BEFORE first gpg invocation
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          # Import signing key
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          GPG_NAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          echo "Signing as: ${GPG_NAME}"
          # Configure rpm macros — only set key name, use default sign command
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${GPG_NAME}" >> ~/.rpmmacros
          # Sign packages
          rpmsign --addsign ~/rpmbuild/RPMS/x86_64/*.rpm
          rpmsign --addsign ~/rpmbuild/SRPMS/*.src.rpm || true
          # Import public key into rpm db and verify
          gpg --export --armor "${GPG_NAME}" | rpm --import -
          rpm --checksig ~/rpmbuild/RPMS/x86_64/*.rpm

      - name: Copy RPM and SRPM to workspace
        run: |
          cp ~/rpmbuild/RPMS/x86_64/*.rpm ${GITHUB_WORKSPACE}/ || true
          cp ~/rpmbuild/SRPMS/*.src.rpm ${GITHUB_WORKSPACE}/ || true

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-packages
          path: ./*.rpm

  build-deb:
    needs: [fetch-deps, extract-version]
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y debhelper devscripts sbcl libfixposix-dev gcc make gpg dpkg-sig

      - name: Update changelog version
        run: |
          sed -i "s/^icl (.*)/icl (${VERSION}-1) unstable; urgency=medium/" releng/debian/changelog

      - name: Build DEB packages (binary and source)
        run: |
          ln -s releng/debian debian
          dpkg-buildpackage -uc -us

      - name: Verify version is not dirty
        run: |
          VERSION=$(./icl --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Sign DEB packages
        env:
          DEB_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.DEB_GPG_PRIVATE_KEY != '' }}
        run: |
          # Configure gpg for non-interactive use
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          # Import signing key
          echo "${DEB_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          GPG_NAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          echo "Signing as: ${GPG_NAME}"
          # Sign .deb packages
          dpkg-sig -k "${GPG_NAME}" --sign builder ../*.deb
          # Verify signatures
          dpkg-sig --verify ../*.deb

      - name: Copy DEB and source files to workspace
        run: |
          cp ../*.deb . 2>/dev/null || true
          cp ../*.dsc . 2>/dev/null || true
          cp ../*.tar.* . 2>/dev/null || true
          cp ../*.buildinfo . 2>/dev/null || true
          cp ../*.changes . 2>/dev/null || true

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-packages
          path: |
            ./*.deb
            ./*.dsc
            ./*.tar.*
            ./*.buildinfo
            ./*.changes

  # ========================================
  # Build Windows executable and installers
  # ========================================
  build-windows:
    needs: [fetch-deps, extract-version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Install SBCL and build tools
        shell: powershell
        run: |
          choco install -y sbcl make nsis
          # Add SBCL to PATH for subsequent bash steps
          $sbclPath = (Get-Command sbcl).Source | Split-Path
          echo "$sbclPath" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: make

      - name: Verify version is not dirty
        run: |
          VERSION=$(./icl.exe --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Package Windows binary (ZIP)
        shell: powershell
        run: |
          $VERSION = $env:VERSION
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item icl.exe, README.md, LICENSE -Destination dist/
          Copy-Item "assets/OPEN-SOURCE-NOTICES.txt" -Destination dist/
          # Include slynk for backend support
          $slynkDir = Get-ChildItem -Path ocicl -Filter "sly-*" -Directory | Select-Object -First 1
          if ($slynkDir) {
            Copy-Item -Recurse "$($slynkDir.FullName)/slynk" -Destination dist/
          }
          # Include bundled ASDF (for Lisps that don't bundle it)
          Copy-Item -Recurse "3rd-party" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "icl-${VERSION}-windows-amd64.zip"

      - name: Build NSIS installer (EXE)
        shell: powershell
        run: |
          $VERSION = $env:VERSION
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$VERSION releng\installer\nsis\icl.nsi
          Move-Item "releng\installer\nsis\icl-$VERSION-setup.exe" "."

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 -g

      - name: Build MSI installer
        shell: powershell
        run: |
          $VERSION = $env:VERSION
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          # Copy files to wix directory for building
          Copy-Item "icl.exe" "releng\installer\wix\"
          Copy-Item "LICENSE" "releng\installer\wix\"
          Copy-Item "README.md" "releng\installer\wix\"
          Copy-Item "assets/OPEN-SOURCE-NOTICES.txt" "releng\installer\wix\"
          Copy-Item -Recurse "emacs" "releng\installer\wix\"
          # Copy bundled ASDF
          Copy-Item -Recurse "3rd-party" "releng\installer\wix\"
          cd releng\installer\wix
          wix build icl.wxs -o "..\..\..\icl-$VERSION.msi" -d VERSION=$VERSION -d SourceDir=. -ext WixToolset.UI.wixext

      - name: Calculate checksums
        run: |
          sha256sum icl-${VERSION}-windows-amd64.zip > checksums-windows.txt
          sha256sum icl-${VERSION}-setup.exe >> checksums-windows.txt
          sha256sum icl-${VERSION}.msi >> checksums-windows.txt
          cat checksums-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: |
            ./icl-*-windows-*.zip
            ./*-setup.exe
            ./*.msi
            ./checksums-windows.txt

  # ========================================
  # Build Chocolatey package
  # ========================================
  build-chocolatey:
    needs: [build-windows, extract-version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-package
          path: artifacts

      - name: Get checksum
        id: info
        shell: bash
        run: |
          CHECKSUM=$(grep "windows-amd64.zip" artifacts/checksums-windows.txt | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Update Chocolatey package
        shell: bash
        env:
          CHECKSUM: ${{ steps.info.outputs.checksum }}
        run: |
          # Update nuspec version
          sed -i "s/<version>.*<\/version>/<version>${VERSION}<\/version>/" releng/chocolatey/icl.nuspec

          # Update install script with version and checksum
          sed -i "s/__VERSION__/${VERSION}/g" releng/chocolatey/tools/chocolateyInstall.ps1
          sed -i "s/__CHECKSUM__/${CHECKSUM}/g" releng/chocolatey/tools/chocolateyInstall.ps1

      - name: Build Chocolatey package
        shell: powershell
        run: |
          cd releng\chocolatey
          choco pack

      - name: Upload Chocolatey package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chocolatey-package
          path: releng/chocolatey/*.nupkg

      - name: Push to Chocolatey.org
        if: ${{ vars.PUSH_TO_CHOCOLATEY == 'true' }}
        continue-on-error: true
        shell: powershell
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          cd releng\chocolatey
          $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
          choco push $nupkg.Name --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Chocolatey push failed (may be pending moderation). Package is still available as artifact."
          }

  # ========================================
  # Build Linux tarball (for self-update)
  # ========================================
  build-linux-tarball:
    needs: [fetch-deps, extract-version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libfixposix-dev gcc make

      - name: Build
        run: make

      - name: Verify version is not dirty
        run: |
          VERSION=$(./icl --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp icl dist/
          cp README.md LICENSE assets/OPEN-SOURCE-NOTICES.txt dist/
          # Include slynk for backend support
          cp -r ocicl/sly-*/slynk dist/
          # Include bundled ASDF (for Lisps that don't bundle it)
          cp -r 3rd-party dist/
          cd dist && tar czf ../icl-${VERSION}-linux-amd64.tar.gz *

      - name: Upload Linux tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tarball
          path: ./*.tar.gz

  # ========================================
  # Build macOS executables
  # ========================================
  build-macos-arm64:
    needs: [fetch-deps, extract-version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Install dependencies
        run: |
          brew install sbcl libfixposix

      - name: Build
        run: make

      - name: Verify version is not dirty
        run: |
          VERSION=$(./icl --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Package macOS binary
        run: |
          mkdir -p dist
          cp icl dist/
          cp README.md LICENSE assets/OPEN-SOURCE-NOTICES.txt dist/
          # Include slynk for backend support
          cp -r ocicl/sly-*/slynk dist/
          # Include bundled ASDF (for Lisps that don't bundle it)
          cp -r 3rd-party dist/
          cd dist && tar czf ../icl-${VERSION}-darwin-arm64.tar.gz *

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-arm64-package
          path: ./*.tar.gz

  build-macos-amd64:
    needs: [fetch-deps, extract-version]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download ocicl dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocicl-deps
          path: ocicl

      - name: Remove .git to prevent dirty version detection
        run: rm -rf .git

      - name: Install dependencies
        run: |
          brew install sbcl libfixposix

      - name: Build
        run: make

      - name: Verify version is not dirty
        run: |
          VERSION=$(./icl --version 2>&1 || true)
          echo "icl version: $VERSION"
          if echo "$VERSION" | grep -qi dirty; then
            echo "::error::Version string contains 'dirty': $VERSION"
            exit 1
          fi

      - name: Package macOS binary
        run: |
          mkdir -p dist
          cp icl dist/
          cp README.md LICENSE assets/OPEN-SOURCE-NOTICES.txt dist/
          # Include slynk for backend support
          cp -r ocicl/sly-*/slynk dist/
          # Include bundled ASDF (for Lisps that don't bundle it)
          cp -r 3rd-party dist/
          cd dist && tar czf ../icl-${VERSION}-darwin-amd64.tar.gz *

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-amd64-package
          path: ./*.tar.gz

  # ========================================
  # Sign release tarballs with Cosign
  # ========================================
  sign-artifacts:
    needs: [build-linux-tarball, build-macos-arm64, build-macos-amd64, extract-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Download Linux tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-tarball
          path: ./artifacts

      - name: Download macOS ARM64 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin-arm64-package
          path: ./artifacts

      - name: Download macOS AMD64 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin-amd64-package
          path: ./artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign tarballs with Cosign
        run: |
          cd artifacts
          for f in *.tar.gz; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosign-bundles
          path: artifacts/*.bundle

  # ========================================
  # Generate SLSA Level 3 provenance
  # ========================================
  generate-provenance-subjects:
    needs: [build-rpm, build-deb, build-linux-tarball, build-windows, build-macos-arm64, build-macos-amd64, extract-version]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate hashes for SLSA provenance
        id: hash
        run: |
          cd artifacts
          find . -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.msi' \) -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > checksums.txt
          cat checksums.txt
          echo "hashes=$(cat checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  slsa-provenance:
    needs: [generate-provenance-subjects]
    permissions:
      actions: read
      id-token: write
      contents: write
    # NOTE: SLSA generator requires a tag ref, not a commit SHA — it validates
    # the builder binary against the release tag. Pinning to SHA breaks it.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.generate-provenance-subjects.outputs.hashes }}"
      upload-assets: true
      provenance-name: provenance.intoto.jsonl

  # ========================================
  # Create GitHub Release
  # ========================================
  release:
    needs: [build-rpm, build-deb, build-linux-tarball, build-windows, build-chocolatey, build-macos-arm64, build-macos-amd64, sign-artifacts, slsa-provenance, extract-version]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate unified checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.nupkg' -o -name '*.json' \) -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../checksums.sha256
          cat ../checksums.sha256

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: docs/release-notes/RELEASE-NOTES-${{ env.VERSION }}.md
          artifacts: |
            artifacts/rpm-packages/*.rpm
            artifacts/deb-packages/*.deb
            artifacts/deb-packages/*.dsc
            artifacts/deb-packages/*.tar.*
            artifacts/deb-packages/*.buildinfo
            artifacts/deb-packages/*.changes
            artifacts/linux-tarball/*.tar.gz
            artifacts/windows-package/icl-*-windows-*.zip
            artifacts/windows-package/*-setup.exe
